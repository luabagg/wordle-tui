name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: OpenTUI native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # OpenTUI 0.4.x publishes native packages for Linux, macOS, and Windows.
        # Hosted x64/arm selection follows GitHub's current runner architecture.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run check
